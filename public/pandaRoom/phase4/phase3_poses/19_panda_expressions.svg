<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="800" viewBox="0 0 800 800">
<title>Panda expression variants — neutral speaking happy blink</title>
<desc>Original clean unclothed seated panda, built from independent SVG groups. Each group has a stable ID. Hidden expressions are optional variants.</desc>
<defs>
 <linearGradient id="fur" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".82" stop-color="#fffefd"/><stop offset="1" stop-color="#e9e0df"/></linearGradient>
